<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 600" role="img" aria-labelledby="t d">
  <title id="t">Schema: Fokusreihenfolge folgt der Dokumentstruktur, nicht der sichtbaren Anordnung</title>
  <desc id="d">Wireframe einer Seite. Die Tab-Reihenfolge ist nummeriert von 1 bis 7. Sie springt vom Logo in die Navigation, dann zur Suche rechts oben, dann in die Seitenleiste und erreicht den großen Bestellen-Button erst an Stelle 7. Ein Link in der Seitenleiste hat keinen sichtbaren Fokusring. Ein Overlay hält den Fokus in einer Schleife, eine Tastaturfalle.</desc>
  <style>
    text { font-family: Inter, "Neue Haas Unica", Helvetica, Arial, sans-serif; fill: #031121; }
    .h { font-size: 24px; font-weight: 700; }
    .l { font-size: 20px; }
    .s { font-size: 18px; fill: #5a6472; }
    .box { fill: #ffffff; stroke: #c7cdd4; stroke-width: 2; }
    .fill { fill: #e5effb; stroke: #c7cdd4; stroke-width: 2; }
    .dark { fill: #031121; }
    .ring { fill: none; stroke: #3391ff; stroke-width: 4; }
    .num { fill: #1a2f6e; }
    .numt { font-size: 20px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .path { fill: none; stroke: #3391ff; stroke-width: 3; stroke-dasharray: 8 6; marker-end: url(#arrow); }
    .trap { fill: none; stroke: #8a5f00; stroke-width: 3; marker-end: url(#arrowtrap); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3391ff"/></marker>
    <marker id="arrowtrap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a5f00"/></marker>
  </defs>
  <rect width="1260" height="600" fill="#ffffff"/>

  <!-- Seitenrahmen -->
  <rect class="box" x="40" y="40" width="760" height="520"/>
  <!-- Kopf -->
  <rect class="fill" x="40" y="40" width="760" height="80"/>
  <rect class="box" x="60" y="60" width="90" height="40"/><text class="l" x="75" y="87">Logo</text>
  <text class="l" x="200" y="87">Start</text>
  <text class="l" x="290" y="87">Produkte</text>
  <text class="l" x="410" y="87">Kontakt</text>
  <rect class="box" x="600" y="60" width="180" height="40"/><text class="s" x="615" y="87">Suche …</text>
  <!-- Seitenleiste -->
  <rect class="box" x="60" y="140" width="200" height="400"/>
  <text class="l" x="80" y="180">Hilfe</text>
  <text class="l" x="80" y="230">Konto</text>
  <text class="s" x="80" y="280">Newsletter</text>
  <!-- Hauptbereich -->
  <rect class="box" x="290" y="140" width="490" height="240"/>
  <text class="h" x="310" y="185">Produkt des Monats</text>
  <text class="s" x="310" y="220">Beschreibung, Preis, Lieferzeit …</text>
  <rect class="dark" x="310" y="300" width="260" height="56"/>
  <text class="l" x="340" y="336" style="fill:#ffffff;font-weight:700">Jetzt bestellen</text>
  <!-- Overlay -->
  <rect class="fill" x="330" y="410" width="440" height="120" style="fill:#f5f3ee"/>
  <text class="l" x="350" y="445">Cookie-Hinweis (Overlay)</text>
  <rect class="box" x="350" y="470" width="140" height="40"/><text class="s" x="365" y="497">Ablehnen</text>
  <rect class="box" x="510" y="470" width="140" height="40"/><text class="s" x="525" y="497">Akzeptieren</text>
  <path class="trap" d="M 660 490 C 720 490, 720 440, 680 440 C 640 440, 600 460, 560 462"/>
  <text class="s" x="690" y="515" style="fill:#8a5f00;font-weight:700">Schleife</text>

  <!-- Fokusringe und Nummern -->
  <rect class="ring" x="56" y="56" width="98" height="48"/>
  <circle class="num" cx="56" cy="56" r="16"/><text class="numt" x="56" y="63">1</text>
  <circle class="num" cx="200" cy="60" r="16"/><text class="numt" x="200" y="67">2</text>
  <circle class="num" cx="290" cy="60" r="16"/><text class="numt" x="290" y="67">3</text>
  <circle class="num" cx="410" cy="60" r="16"/><text class="numt" x="410" y="67">4</text>
  <circle class="num" cx="600" cy="56" r="16"/><text class="numt" x="600" y="63">5</text>
  <circle class="num" cx="48" cy="152" r="16"/><text class="numt" x="48" y="159">6</text>
  <circle class="num" cx="310" cy="300" r="16"/><text class="numt" x="310" y="307">7</text>
  <!-- Tab-Pfad -->
  <path class="path" d="M 160 80 L 185 80"/>
  <path class="path" d="M 470 80 L 585 80"/>
  <path class="path" d="M 690 110 C 690 150, 200 120, 130 165"/>
  <path class="path" d="M 140 190 C 230 230, 260 290, 300 320"/>
  <!-- Markierung unsichtbarer Fokus -->
  <rect x="70" y="158" width="60" height="30" fill="none" stroke="#c7cdd4" stroke-width="2" stroke-dasharray="3 4"/>

  <!-- Legende rechts -->
  <text class="h" x="840" y="80">Drei Namen für das Erlebte</text>
  <rect class="ring" x="840" y="105" width="40" height="28"/>
  <text class="l" x="895" y="126" style="font-weight:700">Fokus</text>
  <text class="s" x="895" y="152">das Element, das Tasten empfängt</text>

  <circle class="num" cx="860" cy="205" r="16"/><text class="numt" x="860" y="212">7</text>
  <text class="l" x="895" y="211" style="font-weight:700">Fokusreihenfolge</text>
  <text class="s" x="895" y="237">folgt dem Code, nicht dem Layout –</text>
  <text class="s" x="895" y="261">der wichtigste Button kommt zuletzt</text>

  <rect x="842" y="298" width="36" height="24" fill="none" stroke="#c7cdd4" stroke-width="2" stroke-dasharray="3 4"/>
  <text class="l" x="895" y="317" style="font-weight:700">Fokussichtbarkeit</text>
  <text class="s" x="895" y="343">Stelle 6 hat keinen Ring:</text>
  <text class="s" x="895" y="367">outline: none</text>

  <path class="trap" d="M 870 430 C 900 430, 900 405, 870 405 C 848 405, 846 422, 858 428"/>
  <text class="l" x="895" y="425" style="font-weight:700">Tastaturfalle</text>
  <text class="s" x="895" y="451">Escape tut nichts, Tab kreist</text>
  <text class="s" x="895" y="475">im Overlay (WCAG 2.1.2)</text>

  <text class="s" x="840" y="540">WCAG 2.1.1 Tastatur · 2.1.2 Keine Tastaturfalle</text><text class="s" x="840" y="566">2.4.7 Fokus sichtbar</text>
</svg>
