<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d">
  <title id="t">WebAIM Million 2019 bis 2026: Anteil der Startseiten mit erkennbaren WCAG-Fehlern und Fehler pro Startseite</title>
  <desc id="d">Zwei Balkenreihen. Links: Anteil der Startseiten mit Fehlern, von 97,8 Prozent 2019 bis 95,9 Prozent 2026, stets über 94 Prozent. Rechts: Fehler pro Startseite, 2025 51,0 und 2026 56,1, der Anstieg 2026 ist hervorgehoben.</desc>
