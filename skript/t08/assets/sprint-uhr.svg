<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d" font-family="Inter, 'Neue Haas Unica', Arial, sans-serif">
  <title id="t">Sprint-Uhr: 90 Minuten netto mit Abbruchpunkt bei Minute 60, Fünf-Minuten-Warnung bei 85 und Protokoll-Upload bei 90; darunter der vierteilige Protokollstandard</title>
  <desc id="d">Zeitstrahl von Minute 0 bis 90. Markierungen: Start bei 0, Blockmitte bei 75 (Pause, Sprint läuft netto weiter), Abbruchregel greift bei 60, Fünf-Minuten-Warnung bei 85, Upload Meilenstein 2 bei 90. Fußzeile: Kriterium, Fundstelle, Nachweis, Beweisvermerk.</desc>
  <rect width="1200" height="520" fill="#ffffff"/>

  <!-- Zeitstrahl -->
  <text x="80" y="70" font-size="26" font-weight="700" fill="#031121">Sprint-Uhr · 90 Minuten netto</text>
  <rect x="80" y="150" width="1040" height="28" rx="6" fill="#e2eefc"/>
  <!-- Minute 0–60: volle Stichprobe; 60–90: nach Abbruchregel -->
  <rect x="80" y="150" width="693" height="28" rx="6" fill="#3391ff"/>
  <rect x="773" y="150" width="347" height="28" fill="#b9e0ff"/>
  <rect x="1062" y="150" width="58" height="28" fill="#031121"/>

  <!-- Ticks -->
  <g stroke="#5a6472" stroke-width="2">
    <line x1="80" y1="140" x2="80" y2="200"/>
    <line x1="426" y1="140" x2="426" y2="190"/>
    <line x1="773" y1="130" x2="773" y2="210"/>
    <line x1="1062" y1="140" x2="1062" y2="200"/>
    <line x1="1120" y1="130" x2="1120" y2="210"/>
  </g>
  <!-- Abbruchregel-Akzent -->
  <rect x="769" y="118" width="8" height="100" fill="#fcd430"/>

  <g font-size="22" fill="#031121">
    <text x="80" y="236">Min 0</text>
    <text x="426" y="236">Min 30</text>
    <text x="773" y="236">Min 60</text>
    <text x="1062" y="236" text-anchor="end">85</text>
    <text x="1120" y="236" text-anchor="end">90</text>
  </g>
  <g font-size="22" font-weight="700" fill="#031121">
    <text x="80" y="120">Startfreigabe</text>
    <text x="773" y="110" text-anchor="middle">Abbruchregel greift</text>
    <text x="1120" y="110" text-anchor="end">Upload</text>
  </g>
  <g font-size="19" fill="#5a6472">
    <text x="773" y="270" text-anchor="middle">mehr als die Hälfte offen? – streichen und dokumentieren</text>
    <text x="1120" y="270" text-anchor="end">Fünf-Minuten-Warnung · Meilenstein 2</text>
    <text x="80" y="270">volle Stichprobe, vier Rollen parallel</text>
  </g>

  <!-- Protokollstandard als Fußzeile -->
  <text x="80" y="340" font-size="22" font-weight="700" fill="#031121">Jeder Befund trägt vier Angaben</text>
  <g font-size="22" font-weight="700" fill="#ffffff">
    <rect x="80" y="365" width="250" height="100" rx="8" fill="#031121"/>
    <text x="100" y="405">Kriterium</text>
    <rect x="343" y="365" width="250" height="100" rx="8" fill="#031121"/>
    <text x="363" y="405">Fundstelle</text>
    <rect x="607" y="365" width="250" height="100" rx="8" fill="#031121"/>
    <text x="627" y="405">Nachweis</text>
    <rect x="870" y="365" width="250" height="100" rx="8" fill="#031121"/>
    <text x="890" y="405">Beweisvermerk</text>
  </g>
  <g font-size="18" fill="#b9e0ff">
    <text x="100" y="440">Nummer und Stufe</text>
    <text x="363" y="440">Seite plus Element</text>
    <text x="627" y="440">Screenshot oder Transkript</text>
    <text x="890" y="440">Beweisart aus Woche 6</text>
  </g>
  <text x="80" y="500" font-size="18" fill="#5a6472">Ohne Beweisvermerk: Rohmaterial, kein Befund. Nicht geschafft: „nicht geprüft“, nicht abgehakt.</text>
</svg>
