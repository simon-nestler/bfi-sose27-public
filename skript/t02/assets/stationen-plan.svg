<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-label="Stationsplan der Werkstatt: vier Stationen A NVDA, B VoiceOver, C TalkBack, D Zoom 200 Prozent; Runde 1 auf der gut gebauten Seite, Runde 2 nach Stationswechsel auf der schlecht gebauten Seite; an jeder Station dieselben drei Aufgaben">
  <g font-family="Inter, sans-serif" fill="var(--ink, #031121)">
    <!-- Rundenbeschriftung links -->
    <text x="40" y="150" font-size="24" font-weight="700">Runde 1</text>
    <text x="40" y="180" font-size="20">gute Seite · 20 Min</text>
    <text x="40" y="320" font-size="24" font-weight="700">Runde 2</text>
    <text x="40" y="350" font-size="20">schlechte Seite · 20 Min</text>
  </g>

  <!-- Stationen, Runde 1 (hell) -->
  <g stroke="var(--ink, #031121)" stroke-width="3" fill="var(--paper, #FFFFFF)">
    <rect x="300" y="100" width="190" height="110" rx="10"/>
    <rect x="530" y="100" width="190" height="110" rx="10"/>
    <rect x="760" y="100" width="190" height="110" rx="10"/>
    <rect x="990" y="100" width="190" height="110" rx="10"/>
  </g>
  <!-- Stationen, Runde 2 (dunkel) -->
  <g fill="var(--ink, #031121)">
    <rect x="300" y="270" width="190" height="110" rx="10"/>
    <rect x="530" y="270" width="190" height="110" rx="10"/>
    <rect x="760" y="270" width="190" height="110" rx="10"/>
    <rect x="990" y="270" width="190" height="110" rx="10"/>
  </g>

  <g font-family="Inter, sans-serif" text-anchor="middle" fill="var(--ink, #031121)">
    <text x="395" y="145" font-size="26" font-weight="700">A · NVDA</text>
    <text x="395" y="180" font-size="19">Windows</text>
    <text x="625" y="145" font-size="26" font-weight="700">B · VoiceOver</text>
    <text x="625" y="180" font-size="19">macOS · iOS</text>
    <text x="855" y="145" font-size="26" font-weight="700">C · TalkBack</text>
    <text x="855" y="180" font-size="19">Android</text>
    <text x="1085" y="145" font-size="26" font-weight="700">D · Zoom</text>
    <text x="1085" y="180" font-size="19">200 %, Bordmittel</text>
  </g>
  <g font-family="Inter, sans-serif" text-anchor="middle" fill="var(--paper, #FFFFFF)">
    <text x="395" y="315" font-size="26" font-weight="700">A · NVDA</text>
    <text x="395" y="350" font-size="19">Windows</text>
    <text x="625" y="315" font-size="26" font-weight="700">B · VoiceOver</text>
    <text x="625" y="350" font-size="19">macOS · iOS</text>
    <text x="855" y="315" font-size="26" font-weight="700">C · TalkBack</text>
    <text x="855" y="350" font-size="19">Android</text>
    <text x="1085" y="315" font-size="26" font-weight="700">D · Zoom</text>
    <text x="1085" y="350" font-size="19">200 %, Bordmittel</text>
  </g>

  <!-- Stationswechsel: Pfeile schräg von Runde 1 zu Runde 2 -->
  <g stroke="var(--ink, #031121)" stroke-width="2.5" fill="none" stroke-dasharray="8 7">
    <line x1="395" y1="212" x2="610" y2="268"/>
    <line x1="625" y1="212" x2="840" y2="268"/>
    <line x1="855" y1="212" x2="1070" y2="268"/>
    <line x1="1085" y1="212" x2="1085" y2="240"/>
    <line x1="1085" y1="240" x2="410" y2="240"/>
    <line x1="410" y1="240" x2="410" y2="268"/>
  </g>
  <g fill="var(--ink, #031121)">
    <path d="M 600 262 L 616 270 L 606 257 Z"/>
    <path d="M 830 262 L 846 270 L 836 257 Z"/>
    <path d="M 1060 262 L 1076 270 L 1066 257 Z"/>
    <path d="M 402 258 L 410 270 L 418 258 Z"/>
  </g>

  <!-- Aufgabenleiste unten mit gelbem Akzent -->
  <rect x="300" y="410" width="66" height="8" rx="4" fill="#FCD430"/>
  <text x="300" y="446" font-family="Inter, sans-serif" font-size="22" fill="var(--ink, #031121)">An jeder Station dieselben drei Aufgaben: Überschriften erfassen · Formular ausfüllen · Link finden</text>
  <text x="300" y="70" font-family="Inter, sans-serif" font-size="22" fill="var(--ink, #031121)">Jede Person durchläuft zwei Stationen – Zuordnung nach mitgebrachtem Gerät</text>
</svg>
