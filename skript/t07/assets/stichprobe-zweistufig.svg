<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="Zweistufige Stichprobe nach WCAG-EM: Die strukturierte Stichprobe deckt jeden Seitentyp und jede essenzielle Funktion ab, darüber liegt ein Zufallsanteil von rund zehn Prozent als Repräsentativitätskontrolle">
  <!-- Das Objekt: Raster aus 40 Seiten -->
  <g fill="#D9E4EE" stroke="#031121" stroke-width="1.5">
    <rect x="40" y="90" width="48" height="48" rx="4"/><rect x="100" y="90" width="48" height="48" rx="4"/><rect x="160" y="90" width="48" height="48" rx="4"/><rect x="220" y="90" width="48" height="48" rx="4"/><rect x="280" y="90" width="48" height="48" rx="4"/><rect x="340" y="90" width="48" height="48" rx="4"/><rect x="400" y="90" width="48" height="48" rx="4"/><rect x="460" y="90" width="48" height="48" rx="4"/>
    <rect x="40" y="150" width="48" height="48" rx="4"/><rect x="100" y="150" width="48" height="48" rx="4"/><rect x="160" y="150" width="48" height="48" rx="4"/><rect x="220" y="150" width="48" height="48" rx="4"/><rect x="280" y="150" width="48" height="48" rx="4"/><rect x="340" y="150" width="48" height="48" rx="4"/><rect x="400" y="150" width="48" height="48" rx="4"/><rect x="460" y="150" width="48" height="48" rx="4"/>
    <rect x="40" y="210" width="48" height="48" rx="4"/><rect x="100" y="210" width="48" height="48" rx="4"/><rect x="160" y="210" width="48" height="48" rx="4"/><rect x="220" y="210" width="48" height="48" rx="4"/><rect x="280" y="210" width="48" height="48" rx="4"/><rect x="340" y="210" width="48" height="48" rx="4"/><rect x="400" y="210" width="48" height="48" rx="4"/><rect x="460" y="210" width="48" height="48" rx="4"/>
    <rect x="40" y="270" width="48" height="48" rx="4"/><rect x="100" y="270" width="48" height="48" rx="4"/><rect x="160" y="270" width="48" height="48" rx="4"/><rect x="220" y="270" width="48" height="48" rx="4"/><rect x="280" y="270" width="48" height="48" rx="4"/><rect x="340" y="270" width="48" height="48" rx="4"/><rect x="400" y="270" width="48" height="48" rx="4"/><rect x="460" y="270" width="48" height="48" rx="4"/>
    <rect x="40" y="330" width="48" height="48" rx="4"/><rect x="100" y="330" width="48" height="48" rx="4"/><rect x="160" y="330" width="48" height="48" rx="4"/><rect x="220" y="330" width="48" height="48" rx="4"/><rect x="280" y="330" width="48" height="48" rx="4"/><rect x="340" y="330" width="48" height="48" rx="4"/><rect x="400" y="330" width="48" height="48" rx="4"/><rect x="460" y="330" width="48" height="48" rx="4"/>
  </g>
  <!-- Strukturierte Stichprobe: je Seitentyp / Funktion eine Seite (dunkelblau) -->
  <g fill="#031121" stroke="#031121" stroke-width="1.5">
    <rect x="40" y="90" width="48" height="48" rx="4"/>
    <rect x="220" y="90" width="48" height="48" rx="4"/>
    <rect x="100" y="150" width="48" height="48" rx="4"/>
    <rect x="400" y="150" width="48" height="48" rx="4"/>
    <rect x="280" y="210" width="48" height="48" rx="4"/>
    <rect x="460" y="210" width="48" height="48" rx="4"/>
    <rect x="160" y="270" width="48" height="48" rx="4"/>
    <rect x="340" y="330" width="48" height="48" rx="4"/>
  </g>
  <!-- Zufallsanteil: eine Seite, gelb gerahmt (Akzent) -->
  <rect x="400" y="270" width="48" height="48" rx="4" fill="#7FB2E5" stroke="#FCD430" stroke-width="5"/>

  <g font-family="Inter, sans-serif" fill="#031121">
    <text x="40" y="60" font-size="24" font-weight="700">Das Objekt: alle Seiten</text>
    <text x="40" y="420" font-size="20">Seitentypen · essenzielle Funktionen · Technologien</text>
  </g>

  <!-- Legende rechts -->
  <g font-family="Inter, sans-serif" fill="#031121">
    <rect x="620" y="80" width="40" height="40" rx="4" fill="#031121"/>
    <text x="680" y="100" font-size="26" font-weight="700">Stufe 1 · strukturiert</text>
    <text x="680" y="134" font-size="21">jeder Seitentyp, jede essenzielle Funktion,</text>
    <text x="680" y="162" font-size="21">jede Technologie mindestens einmal</text>
    <text x="680" y="196" font-size="21" font-weight="700">beantwortet: Haben wir alles Wichtige geprüft?</text>

    <rect x="620" y="250" width="40" height="40" rx="4" fill="#7FB2E5" stroke="#FCD430" stroke-width="5"/>
    <text x="680" y="270" font-size="26" font-weight="700">Stufe 2 · Zufall, rund 10 %</text>
    <text x="680" y="304" font-size="21">Seiten, die niemand ausgesucht hat –</text>
    <text x="680" y="332" font-size="21">gezogen, nicht gewählt, als Zufall markiert</text>
    <text x="680" y="366" font-size="21" font-weight="700">beantwortet: War unsere Struktur schief?</text>

    <rect x="620" y="420" width="40" height="40" rx="4" fill="#D9E4EE" stroke="#031121" stroke-width="1.5"/>
    <text x="680" y="447" font-size="21">nicht geprüft – das Gutachten sagt es ausdrücklich</text>
  </g>
</svg>
