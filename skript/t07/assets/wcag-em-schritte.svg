<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-label="Die fünf Schritte von WCAG-EM 2.0 als Kette: Scope definieren, Produkt erkunden, Stichprobe ziehen, Stichprobe prüfen, Berichten – darunter die Kursstandards, die jedes Kapitel füllen">
  <g font-family="Inter, sans-serif" text-anchor="middle">
    <!-- Schritte 1-3: heute (dunkelblau) -->
    <rect x="30" y="60" width="210" height="120" rx="10" fill="#031121"/>
    <rect x="270" y="60" width="210" height="120" rx="10" fill="#031121"/>
    <rect x="510" y="60" width="210" height="120" rx="10" fill="#031121"/>
    <!-- Schritt 4: Woche 8 (himmelblau) -->
    <rect x="750" y="60" width="210" height="120" rx="10" fill="#7FB2E5"/>
    <!-- Schritt 5: Gutachten (eisblau) -->
    <rect x="990" y="60" width="190" height="120" rx="10" fill="#D9E4EE" stroke="#031121" stroke-width="2"/>

    <g fill="#FFFFFF">
      <text x="135" y="100" font-size="20">Schritt 1</text>
      <text x="135" y="140" font-size="26" font-weight="700">Scope</text>
      <text x="375" y="100" font-size="20">Schritt 2</text>
      <text x="375" y="140" font-size="26" font-weight="700">Erkunden</text>
      <text x="615" y="100" font-size="20">Schritt 3</text>
      <text x="615" y="140" font-size="26" font-weight="700">Stichprobe</text>
    </g>
    <g fill="#031121">
      <text x="855" y="100" font-size="20">Schritt 4</text>
      <text x="855" y="140" font-size="26" font-weight="700">Prüfen</text>
      <text x="1085" y="100" font-size="20">Schritt 5</text>
      <text x="1085" y="140" font-size="26" font-weight="700">Berichten</text>
    </g>

    <!-- Pfeile -->
    <g fill="#031121">
      <path d="M 242 112 L 242 128 L 268 120 Z"/>
      <path d="M 482 112 L 482 128 L 508 120 Z"/>
      <path d="M 722 112 L 722 128 L 748 120 Z"/>
      <path d="M 962 112 L 962 128 L 988 120 Z"/>
    </g>

    <!-- Gelbe Klammer: heute -->
    <rect x="30" y="196" width="690" height="8" rx="4" fill="#FCD430"/>
    <text x="375" y="236" font-size="22" font-weight="700" fill="#031121">heute: Sie bauen es für Ihr Objekt</text>
    <text x="855" y="236" font-size="22" fill="#031121">Woche 8: Sprint</text>
    <text x="1085" y="236" font-size="22" fill="#031121">Ihr Gutachten</text>

    <!-- Kursstandards darunter -->
    <g fill="#031121" font-size="19">
      <text x="135" y="300">Steckbrief (T03B)</text>
      <text x="135" y="326">Konformitätsziel + Fassung</text>
      <text x="375" y="300">Seitentypen · Funktionen</text>
      <text x="375" y="326">Technologien</text>
      <text x="615" y="300">strukturiert + Zufall</text>
      <text x="615" y="326">als solcher markiert</text>
      <text x="855" y="300">Protokoll · Matrix</text>
      <text x="855" y="326">Beweisvermerke</text>
      <text x="1085" y="300">Bericht</text>
      <text x="1085" y="326">Limitationen</text>
    </g>
  </g>
</svg>
