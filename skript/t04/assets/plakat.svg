<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d">
  <title id="t">Plakat: Woran erkennt man die falschen?</title>
  <desc id="d">Ein Plakat mit der Überschrift Woran erkennt man die falschen? und drei ersten Einträgen: Versionsangabe fehlt, Existenz und Geltung vermischt, glatte Sicherheit bei strittiger Frage. Darunter freie Zeilen für die kommenden Wochen.</desc>
  <style>
    text { font-family: Inter, "Neue Haas Unica", Arial, sans-serif; fill: #031121; }
    .h { font-size: 34px; font-weight: 700; }
    .n { font-size: 22px; font-weight: 700; }
    .e { font-size: 24px; }
    .w { font-size: 18px; fill: #5a6472; }
  </style>
  <rect width="960" height="540" fill="#ffffff"/>
  <!-- Plakatfläche -->
  <rect x="120" y="20" width="720" height="500" fill="#f5f3ee" stroke="#c7cdd4" stroke-width="2"/>
  <!-- Klebestreifen -->
  <rect x="440" y="8" width="80" height="24" fill="#fcd430" transform="rotate(-3 480 20)"/>
  <text x="160" y="85" class="h">Woran erkennt man die falschen?</text>
  <line x1="160" y1="105" x2="800" y2="105" stroke="#031121" stroke-width="3"/>

  <g>
    <circle cx="182" cy="160" r="16" fill="#7fb6f6"/>
    <text x="182" y="168" class="n" text-anchor="middle">1</text>
    <text x="220" y="168" class="e">Versionsangabe fehlt</text>
    <text x="220" y="194" class="w">Woche 4</text>
  </g>
  <g>
    <circle cx="182" cy="240" r="16" fill="#7fb6f6"/>
    <text x="182" y="248" class="n" text-anchor="middle">2</text>
    <text x="220" y="248" class="e">Existenz und Geltung vermischt</text>
    <text x="220" y="274" class="w">Woche 4</text>
  </g>
  <g>
    <circle cx="182" cy="320" r="16" fill="#7fb6f6"/>
    <text x="182" y="328" class="n" text-anchor="middle">3</text>
    <text x="220" y="328" class="e">Glatte Sicherheit bei strittiger Frage</text>
    <text x="220" y="354" class="w">Woche 4</text>
  </g>

  <!-- freie Zeilen -->
  <line x1="160" y1="405" x2="800" y2="405" stroke="#c7cdd4" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="160" y1="450" x2="800" y2="450" stroke="#c7cdd4" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="160" y1="495" x2="800" y2="495" stroke="#c7cdd4" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="800" y="395" class="w" text-anchor="end">wächst bis zu den Referaten</text>
</svg>
