<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="nl-titel">
  <title id="nl-titel">Normen-Landkarte: BFSG und BITV 2.0 als zwei Säulen, EN 301 549 als Scharnier, WCAG 2.1 als technischer Kern</title>
  <style>
    text { font-family: Inter, 'Helvetica Neue', Arial, sans-serif; }
    .etikett { font-size: 26px; font-weight: 700; letter-spacing: 3px; fill: #FCD430; }
    .haupt { font-size: 62px; font-weight: 700; fill: #FFFFFF; }
    .sub { font-size: 27px; fill: #FFFFFF; }
    .bandtitel { font-size: 42px; font-weight: 700; fill: #031121; }
    .bandsub { font-size: 27px; fill: #031121; }
    .tagtext { font-size: 26px; font-weight: 700; fill: #031121; }
    .kerntitel { font-size: 50px; font-weight: 700; fill: #FFFFFF; }
  </style>

  <rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/>

  <!-- Säule Wirtschaft -->
  <rect x="90" y="70" width="650" height="280" rx="14" fill="#031121"/>
  <text class="etikett" x="415" y="130" text-anchor="middle">WIRTSCHAFT</text>
  <text class="haupt" x="415" y="210" text-anchor="middle">BFSG</text>
  <text class="sub" x="415" y="262" text-anchor="middle">gilt seit 28.06.2025 · setzt den EAA um</text>
  <text class="sub" x="415" y="306" text-anchor="middle">Produkte und Dienstleistungen, u. a. E-Commerce</text>

  <!-- Säule öffentliche Hand -->
  <rect x="860" y="70" width="650" height="280" rx="14" fill="#031121"/>
  <text class="etikett" x="1185" y="130" text-anchor="middle">ÖFFENTLICHE HAND</text>
  <text class="haupt" x="1185" y="210" text-anchor="middle">BITV 2.0</text>
  <text class="sub" x="1185" y="262" text-anchor="middle">Bund · Länder und Kommunen: Landesrecht</text>
  <text class="sub" x="1185" y="306" text-anchor="middle">verweist dynamisch auf die harmonisierte EN</text>

  <!-- Verbindungen Säulen → Scharnier -->
  <line x1="415" y1="350" x2="415" y2="430" stroke="#031121" stroke-width="5"/>
  <line x1="1185" y1="350" x2="1185" y2="430" stroke="#031121" stroke-width="5"/>

  <!-- Scharnier EN 301 549 -->
  <rect x="90" y="430" width="1420" height="190" rx="14" fill="#EFE7D7" stroke="#031121" stroke-width="3"/>
  <text class="bandtitel" x="560" y="510" text-anchor="middle">EN 301 549 – das Scharnier</text>
  <text class="bandsub" x="560" y="562" text-anchor="middle">rechtswirksam: V3.2.1 (2021) – im EU-Amtsblatt zitiert</text>
  <rect x="1080" y="470" width="390" height="110" rx="10" fill="#FCD430"/>
  <text class="tagtext" x="1275" y="516" text-anchor="middle">V4.1.0 (2026):</text>
  <text class="tagtext" x="1275" y="552" text-anchor="middle">existiert – gilt nicht</text>

  <!-- Verbindung Scharnier → Kern -->
  <line x1="800" y1="620" x2="800" y2="680" stroke="#031121" stroke-width="5"/>

  <!-- Kern WCAG -->
  <rect x="480" y="680" width="640" height="150" rx="14" fill="#031121"/>
  <text class="kerntitel" x="800" y="748" text-anchor="middle">WCAG 2.1</text>
  <text class="sub" x="800" y="796" text-anchor="middle">der technische Kern – Details in Woche 4</text>
</svg>
